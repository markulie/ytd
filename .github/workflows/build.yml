name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: bash test.sh

      - name: Build
        run: bash build.sh

      # .app is a directory; tar keeps its exec bits, which upload-artifact
      # would otherwise strip when it re-zips the tree
      - name: Package the .app
        run: tar -C dist -czf dist/ytd-macos.tar.gz YTD.app && rm -rf dist/YTD.app

      - uses: actions/upload-artifact@v4
        with:
          name: ytd-macos
          path: dist/ytd-macos.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
